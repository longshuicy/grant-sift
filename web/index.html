<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellwether — funding watch</title>
<style>
  :root {
    --paper:      #f3f5f2;
    --card:       #fbfcfa;
    --ink:        #19211e;
    --ink-soft:   #5d6763;
    --ink-faint:  #8b948f;
    --rule:       #dbe0da;
    --moss:       #2f5d50;
    --ember:      #9c3b22;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 40px 28px 80px; }

  /* ---- status strip: the operationally characteristic thing ---- */
  .strip {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 34px;
    padding-bottom: 20px; border-bottom: 2px solid var(--ink);
  }
  .brand { font-family: var(--serif); font-size: 30px; letter-spacing: -0.01em; margin-right: auto; }
  .brand span { color: var(--ink-faint); font-size: 14px; font-family: var(--sans); margin-left: 12px; }
  .stat b { font-family: var(--serif); font-size: 26px; font-weight: 600; display: block; line-height: 1.1; }
  .stat i { font-style: normal; font-size: 12.5px; color: var(--ink-soft); }
  .stat.warn b { color: var(--ember); }

  .alarm {
    margin-top: 16px; padding: 11px 14px;
    background: #f6ece8; border-left: 3px solid var(--ember);
    font-size: 13.5px; color: #6d2b18;
  }

  /* ---- controls ---- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 26px 0 8px;
  }
  .search {
    flex: 1 1 260px; min-width: 200px;
    padding: 9px 12px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
  }
  .search:focus, .chip:focus-visible, .sortsel:focus {
    outline: 2px solid var(--moss); outline-offset: 1px;
  }
  .chip {
    padding: 7px 13px; font: inherit; font-size: 13.5px;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sortsel { padding: 8px 10px; font: inherit; font-size: 13.5px;
             background: var(--card); border: 1px solid var(--rule); border-radius: 3px; }
  .tally { font-size: 13px; color: var(--ink-faint); padding: 6px 0 14px; }

  /* ---- the list: an agenda, not cards ---- */
  .row {
    display: grid; grid-template-columns: 96px 1fr; gap: 22px;
    padding: 20px 0; border-bottom: 1px solid var(--rule);
  }
  .when { font-family: var(--serif); text-align: right; padding-top: 2px; }
  .when .d { font-size: 21px; line-height: 1.05; display: block; }
  .when .m { font-size: 12.5px; color: var(--ink-soft); font-family: var(--sans); }
  .when .away { font-size: 12px; color: var(--ink-faint); font-family: var(--sans); display: block; margin-top: 3px; }
  .row.soon .when .d, .row.soon .when .away { color: var(--ember); }
  .when .rolling { font-size: 13px; color: var(--ink-faint); font-family: var(--sans); }

  h2.title { font-family: var(--serif); font-size: 19.5px; font-weight: 600;
             margin: 0 0 5px; line-height: 1.3; max-width: 66ch; }
  h2.title a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  h2.title a:hover { border-bottom-color: var(--ink); }

  .meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 9px; }
  .meta em { font-style: normal; color: var(--ink-faint); }
  .cap { color: var(--ember); }

  .why { max-width: 72ch; margin: 0 0 10px; }

  .fit {
    max-width: 72ch; padding: 9px 12px; background: var(--card);
    border-left: 2px solid var(--moss); font-size: 13.5px; color: var(--ink-soft);
  }
  .fit b { color: var(--moss); font-weight: 600; }
  .fit .cold { color: var(--ink-faint); font-weight: 400; }

  /* relevance as a bar, not a badge */
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar .track { width: 74px; height: 3px; background: var(--rule); }
  .bar .fill { height: 3px; background: var(--moss); }
  .bar .num { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  details.more { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); max-width: 72ch; }
  details.more summary { cursor: pointer; color: var(--moss); }
  details.more p { margin: 8px 0 0; }

  .empty { padding: 60px 0; text-align: center; color: var(--ink-soft); }
  .empty b { font-family: var(--serif); font-size: 19px; display: block; color: var(--ink); margin-bottom: 6px; }

  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--rule);
           font-size: 12.5px; color: var(--ink-faint); }

  @media (max-width: 620px) {
    .shell { padding: 26px 18px 60px; }
    .row { grid-template-columns: 1fr; gap: 8px; }
    .when { text-align: left; }
    .when .d, .when .m { display: inline; font-size: 14px; }
    .brand { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">

  <header class="strip">
    <div class="brand">Bellwether<span id="asof">loading</span></div>
    <div class="stat"><b id="n-open">—</b><i>open</i></div>
    <div class="stat warn"><b id="n-soon">—</b><i>close within 30 days</i></div>
    <div class="stat"><b id="n-match">—</b><i>match a past collaborator</i></div>
  </header>

  <div id="alarm"></div>

  <div class="controls">
    <input id="q" class="search" type="search" placeholder="Search titles, funders, people">
    <button class="chip" data-filter="soon" aria-pressed="false">Closing soon</button>
    <button class="chip" data-filter="match" aria-pressed="false">Roster match</button>
    <button class="chip" data-filter="embedded" aria-pressed="false">Domain calls</button>
    <button class="chip" data-filter="ci" aria-pressed="false">CI programs</button>
    <button class="chip" data-filter="foundation" aria-pressed="false">Foundations</button>
    <select id="sort" class="sortsel">
      <option value="deadline">Soonest deadline</option>
      <option value="score">Best fit</option>
      <option value="new">Newest</option>
    </select>
  </div>

  <div class="tally" id="tally"></div>
  <main id="list"></main>

  <footer id="foot"></footer>
</div>

<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let DATA = [], ACTIVE = new Set(), QUERY = "", SORT = "deadline";

const daysAway = d => d ? Math.ceil((new Date(d + "T00:00:00") - new Date().setHours(0,0,0,0)) / 864e5) : null;
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function matches(o) {
  if (QUERY) {
    const hay = [o.title, o.agency, o.source, o.match_name, o.match_project, o.rationale]
      .join(" ").toLowerCase();
    if (!hay.includes(QUERY)) return false;
  }
  for (const f of ACTIVE) {
    if (f === "soon"     && !(daysAway(o.deadline) !== null && daysAway(o.deadline) <= 30)) return false;
    if (f === "match"    && !o.match_name) return false;
    if (f === "embedded" && !["embedded_software","domain_subaward"].includes(o.category)) return false;
    if (f === "ci"       && o.category !== "ci_program") return false;
    if (f === "foundation" && ["grants.gov","nsf"].includes(o.source)) return false;
  }
  return true;
}

function sortRows(rows) {
  const by = {
    deadline: (a,b) => (a.deadline || "9999") .localeCompare(b.deadline || "9999") || b.score - a.score,
    score:    (a,b) => b.score - a.score,
    new:      (a,b) => (b.first_seen || "").localeCompare(a.first_seen || "")
  }[SORT];
  return [...rows].sort(by);
}

function rowHTML(o) {
  const away = daysAway(o.deadline);
  const soon = away !== null && away <= 30;
  let when;
  if (o.deadline) {
    const dt = new Date(o.deadline + "T00:00:00");
    when = `<span class="d">${dt.getDate()}</span>
            <span class="m">${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}</span>
            <span class="away">${away < 0 ? "passed" : away + (away === 1 ? " day" : " days")}</span>`;
  } else {
    when = `<span class="rolling">rolling</span>`;
  }

  const bits = [esc(o.agency || o.source)];
  if (o.award_ceiling) bits.push("up to " + esc(o.award_ceiling));
  const cap = o.indirect_cap
    ? `<span class="cap">indirect capped at ${esc(o.indirect_cap)}</span>` : "";

  const fit = o.match_name ? `
    <div class="fit">Closest fit: <b>${esc(o.match_name)}</b>
      ${o.match_project ? " — " + esc(o.match_project) : ""}
      ${o.match_status && o.match_status !== "warm"
        ? `<span class="cold">(${esc(o.match_status)})</span>` : ""}
      ${o.match_rationale ? "<br>" + esc(o.match_rationale) : ""}</div>` : "";

  return `<article class="row${soon ? " soon" : ""}">
    <div class="when">${when}</div>
    <div>
      <div class="bar">
        <span class="track"><span class="fill" style="width:${Math.max(4, o.score * 0.74)}px"></span></span>
        <span class="num">${o.score}</span>
      </div>
      <h2 class="title"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a></h2>
      <div class="meta">${bits.join(" &nbsp;·&nbsp; ")}${cap ? " &nbsp;·&nbsp; " + cap : ""}</div>
      <p class="why">${esc(o.rationale)}</p>
      ${fit}
      ${o.synopsis ? `<details class="more"><summary>Read the call</summary>
        <p>${esc(o.synopsis)}</p></details>` : ""}
    </div>
  </article>`;
}

function render() {
  const rows = sortRows(DATA.filter(matches));
  document.getElementById("tally").textContent =
    `${rows.length} of ${DATA.length} shown`;
  document.getElementById("list").innerHTML = rows.length
    ? rows.map(rowHTML).join("")
    : `<div class="empty"><b>Nothing matches those filters.</b>
         Clear a filter, or widen the search.</div>`;
}

function boot(payload) {
  DATA = payload.opportunities || [];
  const soon = DATA.filter(o => { const a = daysAway(o.deadline); return a !== null && a >= 0 && a <= 30; });
  document.getElementById("n-open").textContent  = DATA.length;
  document.getElementById("n-soon").textContent  = soon.length;
  document.getElementById("n-match").textContent = DATA.filter(o => o.match_name).length;
  document.getElementById("asof").textContent =
    "updated " + (payload.generated_at || "").slice(0, 10);

  const stale = payload.stale_sources || [];
  if (stale.length) {
    document.getElementById("alarm").innerHTML =
      `<div class="alarm">${stale.length} source${stale.length > 1 ? "s have" : " has"}
       not updated in over 30 days: ${stale.map(s => esc(s.name)).join(", ")}.
       Check the adapter before trusting this list as complete.</div>`;
  }
  document.getElementById("foot").textContent =
    `Generated ${payload.generated_at || "—"}. Scores and collaborator matches are model-generated; treat them as a first pass, not a decision.`;
  render();
}

document.getElementById("q").addEventListener("input", e => {
  QUERY = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("sort").addEventListener("change", e => {
  SORT = e.target.value; render();
});
document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const f = btn.dataset.filter;
    ACTIVE.has(f) ? ACTIVE.delete(f) : ACTIVE.add(f);
    btn.setAttribute("aria-pressed", ACTIVE.has(f));
    render();
  });
});

fetch("opportunities.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(() => {
    document.getElementById("list").innerHTML =
      `<div class="empty"><b>No data file yet.</b>
       Run <code>python run.py daily</code> to generate opportunities.json.</div>`;
    document.getElementById("asof").textContent = "no data";
  });
</script>
</body>
</html>
