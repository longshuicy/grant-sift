<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grant Sift: funding watch</title>
<style>
  :root {
    --paper:      #f3f5f2;
    --card:       #fbfcfa;
    --ink:        #19211e;
    --ink-soft:   #5d6763;
    --ink-faint:  #8b948f;
    --rule:       #dbe0da;
    --moss:       #2f5d50;
    --ember:      #9c3b22;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1180px; margin: 0 auto; padding: 40px 28px 80px; }

  /* ---- status strip: the operationally characteristic thing ---- */
  .strip {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 34px;
    padding-bottom: 20px; border-bottom: 2px solid var(--ink);
  }
  .brand { font-family: var(--serif); font-size: 30px; letter-spacing: -0.01em; margin-right: auto; }
  .brand span { color: var(--ink-faint); font-size: 14px; font-family: var(--sans); margin-left: 12px; }
  .stat b { font-family: var(--serif); font-size: 26px; font-weight: 600; display: block; line-height: 1.1; }
  .stat i { font-style: normal; font-size: 12.5px; color: var(--ink-soft); }
  .stat.warn b { color: var(--ember); }

  .alarm {
    margin-top: 16px; padding: 11px 14px;
    background: #f6ece8; border-left: 3px solid var(--ember);
    font-size: 13.5px; color: #6d2b18;
  }

  /* ---- controls ---- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin: 26px 0 8px;
  }
  .search {
    flex: 1 1 260px; min-width: 200px;
    padding: 9px 12px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--rule); border-radius: 3px;
  }
  .search:focus, .chip:focus-visible, .sortsel:focus {
    outline: 2px solid var(--moss); outline-offset: 1px;
  }
  .chip {
    padding: 7px 13px; font: inherit; font-size: 13.5px;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--rule); border-radius: 999px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .sortsel { padding: 8px 10px; font: inherit; font-size: 13.5px;
             background: var(--card); border: 1px solid var(--rule); border-radius: 3px; }
  .tally { font-size: 13px; color: var(--ink-faint); padding: 6px 0 14px; }

  /* ---- the list: an agenda, not cards ---- */
  .row {
    display: grid; grid-template-columns: 96px 1fr; gap: 22px;
    padding: 20px 0; border-bottom: 1px solid var(--rule);
  }
  .when { font-family: var(--serif); text-align: right; padding-top: 2px; }
  .when .d { font-size: 21px; line-height: 1.05; display: block; }
  .when .m { font-size: 12.5px; color: var(--ink-soft); font-family: var(--sans); }
  .when .away { font-size: 12px; color: var(--ink-faint); font-family: var(--sans); display: block; margin-top: 3px; }
  .row.soon .when .d, .row.soon .when .away { color: var(--ember); }
  .when .rolling { font-size: 13px; color: var(--ink-faint); font-family: var(--sans); }

  h2.title { font-family: var(--serif); font-size: 19.5px; font-weight: 600;
             margin: 0 0 5px; line-height: 1.3; max-width: 66ch; }
  h2.title a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
  h2.title a:hover { border-bottom-color: var(--ink); }

  .meta { font-size: 13px; color: var(--ink-soft); margin-bottom: 9px; }
  .meta em { font-style: normal; color: var(--ink-faint); }
  .cap { color: var(--ember); }

  .why { max-width: 72ch; margin: 0 0 10px; }

  .fit {
    max-width: 72ch; padding: 9px 12px; background: var(--card);
    border-left: 2px solid var(--moss); font-size: 13.5px; color: var(--ink-soft);
  }
  .fit b { color: var(--moss); font-weight: 600; }
  .fit .cold { color: var(--ink-faint); font-weight: 400; }

  /* relevance as a bar, not a badge */
  .bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .bar .track { width: 74px; height: 3px; background: var(--rule); }
  .bar .fill { height: 3px; background: var(--moss); }
  .bar .num { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }

  details.more { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); max-width: 72ch; }
  details.more summary { cursor: pointer; color: var(--moss); }
  details.more p { margin: 8px 0 0; }
  .acts { margin-top: 8px; }
  .act { font-size: 13px; color: var(--moss); text-decoration: none; }
  .act:hover { text-decoration: underline; }
  .amt { color: var(--ink); font-weight: 500; }
  .nosyn { margin: 8px 0 0; font-size: 13px; color: var(--ink-faint); }
  .areatag { display: inline-block; float: right; margin: 0 0 4px 8px; padding: 1px 7px;
             font: inherit; font-size: 11.5px; color: var(--ink-soft); cursor: pointer;
             background: var(--paper); border: 1px solid var(--rule); border-radius: 9px; }
  .areatag:hover { color: var(--moss); border-color: var(--moss); }

  .acts { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .vote { font: inherit; font-size: 13px; padding: 2px 9px; cursor: pointer;
          color: var(--ink-soft); background: var(--paper);
          border: 1px solid var(--rule); border-radius: 11px; }
  .vote:hover:not(:disabled) { color: var(--moss); border-color: var(--moss); }
  .vote[aria-pressed="true"] { color: var(--moss); border-color: var(--moss); font-weight: 500; }
  .vote:disabled { opacity: .45; cursor: not-allowed; }
  .votenote { font-size: 12px; color: var(--ink-faint); }
  .fbbox { margin-top: 8px; display: none; gap: 6px; }
  .fbbox.on { display: flex; flex-wrap: wrap; }
  .fbbox input { flex: 1 1 260px; font: inherit; font-size: 13px; padding: 4px 7px;
                 border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }

  .chat { margin-top: 10px; display: none; border-left: 2px solid var(--rule); padding-left: 12px; }
  .chat.on { display: block; }
  .chat .log { max-height: 320px; overflow-y: auto; font-size: 13.5px; }
  .chat .turn { margin: 8px 0; white-space: pre-wrap; }
  .chat .turn b { color: var(--moss); font-weight: 500; }
  .chat form { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chat input[type=text] { flex: 1 1 240px; font: inherit; font-size: 13px; padding: 4px 7px;
                 border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  .chat .hint { font-size: 12px; color: var(--ink-faint); margin-top: 6px; }
  .keybar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            margin: 0 0 14px; padding: 9px 12px; font-size: 13px;
            background: var(--paper); border: 1px solid var(--rule); }
  .keybar input, .keybar select { font: inherit; font-size: 13px; padding: 3px 6px;
            border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
  .keybar input[type=password] { flex: 1 1 200px; }
  .offline { color: var(--ink-faint); font-size: 12.5px; }

  .empty { padding: 60px 0; text-align: center; color: var(--ink-soft); }
  .empty b { font-family: var(--serif); font-size: 19px; display: block; color: var(--ink); margin-bottom: 6px; }

  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--rule);
           font-size: 12.5px; color: var(--ink-faint); }

  @media (max-width: 620px) {
    .shell { padding: 26px 18px 60px; }
    .row { grid-template-columns: 1fr; gap: 8px; }
    .when { text-align: left; }
    .when .d, .when .m { display: inline; font-size: 14px; }
    .brand { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="shell">

  <header class="strip">
    <div class="brand">Grant Sift<span id="asof">loading</span></div>
    <div class="stat"><b id="n-open">..</b><i>open calls</i></div>
    <div class="stat warn"><b id="n-soon">..</b><i>close within 30 days</i></div>
    <div class="stat"><b id="n-match">..</b><i>match a past collaborator</i></div>
  </header>

  <div id="alarm"></div>

  <div class="controls">
    <input id="q" class="search" type="search" placeholder="Search titles, funders, people">
    <button class="chip" data-filter="soon" aria-pressed="false">Closing soon</button>
    <button class="chip" data-filter="match" aria-pressed="false">Roster match</button>
    <button class="chip" data-filter="embedded" aria-pressed="false">Domain calls</button>
    <button class="chip" data-filter="ci" aria-pressed="false">CI programs</button>
    <button class="chip" data-filter="foundation" aria-pressed="false">Foundations</button>
    <select id="area" class="sortsel" aria-label="Filter by roster area">
      <option value="">All roster areas</option>
    </select>
    <select id="sort" class="sortsel">
      <option value="deadline">Sort: soonest deadline</option>
      <option value="score">Sort: highest relevance</option>
      <option value="new">Sort: recently added</option>
    </select>
  </div>

  <div class="keybar" id="keybar" hidden>
    <span><b>Chat key</b></span>
    <input id="k-key" type="password" placeholder="your API key (sk_...)" autocomplete="off">
    <input id="k-model" type="text" placeholder="model" value="gemma-4-31b-it" size="16">
    <input id="k-base" type="text" placeholder="base URL" value="https://lumen.ncsa.illinois.edu/v1" size="30">
    <span class="offline" id="k-note">held in this tab only, never stored on the server</span>
  </div>

  <div class="tally" id="tally"></div>
  <main id="list"></main>

  <footer id="foot"></footer>
</div>

<script>
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let DATA = [], ACTIVE = new Set(), QUERY = "", SORT = "deadline", AREA = "";

const daysAway = d => d ? Math.ceil((new Date(d + "T00:00:00") - new Date().setHours(0,0,0,0)) / 864e5) : null;
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function matches(o) {
  if (AREA && o.match_domain !== AREA) return false;
  if (QUERY) {
    const hay = [o.title, o.agency, o.source, o.match_name, o.match_domain, o.match_project, o.rationale]
      .join(" ").toLowerCase();
    if (!hay.includes(QUERY)) return false;
  }
  for (const f of ACTIVE) {
    if (f === "soon"     && !(daysAway(o.deadline) !== null && daysAway(o.deadline) <= 30)) return false;
    if (f === "match"    && !o.match_name) return false;
    if (f === "embedded" && !["embedded_software","domain_subaward"].includes(o.category)) return false;
    if (f === "ci"       && o.category !== "ci_program") return false;
    if (f === "foundation" && ["grants.gov","nsf"].includes(o.source)) return false;
  }
  return true;
}

function sortRows(rows) {
  const by = {
    deadline: (a,b) => (a.deadline || "9999") .localeCompare(b.deadline || "9999") || b.score - a.score,
    score:    (a,b) => b.score - a.score,
    new:      (a,b) => (b.first_seen || "").localeCompare(a.first_seen || "")
  }[SORT];
  return [...rows].sort(by);
}

function rowHTML(o) {
  const away = daysAway(o.deadline);
  const soon = away !== null && away <= 30;
  let when;
  if (o.deadline) {
    const dt = new Date(o.deadline + "T00:00:00");
    when = `<span class="d">${dt.getDate()}</span>
            <span class="m">${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}</span>
            <span class="away">${away < 0 ? "passed" : away + (away === 1 ? " day" : " days")}</span>`;
  } else {
    when = `<span class="rolling">rolling</span>`;
  }

  const bits = [esc(o.agency || o.source)];
  if (o.award_ceiling) bits.push(`<span class="amt">award ${esc(o.award_ceiling)}</span>`);
  const cap = o.indirect_cap
    ? `<span class="cap">indirect capped at ${esc(o.indirect_cap)}</span>` : "";

  const area = o.match_domain
    ? `<button class="areatag" data-area="${esc(o.match_domain)}" title="Show only this roster area">${esc(o.match_domain)}</button>`
    : "";
  const fit = o.match_name ? `
    <div class="fit">${area}Closest fit: <b>${esc(o.match_name)}</b>
      ${o.match_project ? ": " + esc(o.match_project) : ""}
      ${o.match_status && o.match_status !== "warm"
        ? `<span class="cold">(${esc(o.match_status)})</span>` : ""}
      ${o.match_rationale ? "<br>" + esc(o.match_rationale) : ""}</div>` : "";

  return `<article class="row${soon ? " soon" : ""}">
    <div class="when">${when}</div>
    <div>
      <div class="bar">
        <span class="track" role="img" aria-label="Relevance ${o.score} of 100"><span class="fill" style="width:${Math.max(4, o.score * 0.74)}px"></span></span>
        <span class="num" title="How well this matches the group's work, scored 0 to 100 by the model">relevance ${o.score}/100</span>
      </div>
      <h2 class="title">${o.url
        ? `<a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.title)}</a>`
        : esc(o.title)}</h2>
      <div class="meta">${bits.join(" &nbsp;·&nbsp; ")}${cap ? " &nbsp;·&nbsp; " + cap : ""}</div>
      <p class="why">${esc(o.rationale)}</p>
      ${fit}
      <div class="acts">
        ${o.url ? `<a class="act" href="${esc(o.url)}" target="_blank" rel="noopener">Open the full call &rarr;</a>` : ""}
        <button class="vote" data-vote="up"   data-id="${esc(o.id)}" aria-pressed="false" title="Good find: score it higher next time">&#9651; useful</button>
        <button class="vote" data-vote="down" data-id="${esc(o.id)}" aria-pressed="false" title="Not for us: score it lower next time">&#9661; not for us</button>
        <button class="act" data-chat="${esc(o.id)}">Ask about this call</button>
        <span class="votenote" data-fb="${esc(o.id)}"></span>
      </div>
      <div class="fbbox" data-fbbox="${esc(o.id)}">
        <input type="text" maxlength="500" placeholder="one comment, optional: why?" data-fbnote="${esc(o.id)}">
        <button class="vote" data-fbsend="${esc(o.id)}">Send</button>
      </div>
      <div class="chat" data-chatbox="${esc(o.id)}">
        <div class="log" data-chatlog="${esc(o.id)}"></div>
        <form data-chatform="${esc(o.id)}">
          <input type="text" placeholder="e.g. what would we need a domain PI for here?" data-chatinput="${esc(o.id)}">
          <button class="vote" type="submit">Ask</button>
        </form>
        <div class="hint" data-chathint="${esc(o.id)}"></div>
      </div>
      ${o.synopsis
        ? `<details class="more"><summary>Show summary</summary><p>${esc(o.synopsis)}</p></details>`
        : `<p class="nosyn">No summary was captured for this call. Use "Open the full call".</p>`}
    </div>
  </article>`;
}

function render() {
  const rows = sortRows(DATA.filter(matches));
  document.getElementById("tally").textContent =
    `${rows.length} of ${DATA.length} shown` + (AREA ? ` in "${AREA}"` : "");
  document.getElementById("list").innerHTML = rows.length
    ? rows.map(rowHTML).join("")
    : `<div class="empty"><b>Nothing matches those filters.</b>
         Clear a filter, or widen the search.</div>`;
  // The rows were just replaced, so the new buttons need their state back.
  if (API) { paintFeedback(); } else {
    document.querySelectorAll("[data-vote],[data-chat],[data-fbsend]")
      .forEach(b => { b.disabled = true; });
  }
}


// ---------------------------------------------------------------------------
// Backend features. Everything above works from the static JSON alone; these
// two need `run.py serve`. If it is not answering, the controls disable
// themselves rather than throwing, so the list stays usable.
// ---------------------------------------------------------------------------
let API = false;
const CHATS = {};                       // opportunity id -> [{role, content}]

const keyBar = () => ({
  key:   document.getElementById("k-key").value.trim(),
  model: document.getElementById("k-model").value.trim(),
  base:  document.getElementById("k-base").value.trim(),
});

// sessionStorage, not localStorage: the key should not outlive the tab.
try {
  const saved = JSON.parse(sessionStorage.getItem("gs.chat") || "{}");
  if (saved.model) document.getElementById("k-model").value = saved.model;
  if (saved.base)  document.getElementById("k-base").value  = saved.base;
} catch (e) {}
["k-model", "k-base"].forEach(id =>
  document.getElementById(id).addEventListener("change", () => {
    try {
      const { model, base } = keyBar();
      sessionStorage.setItem("gs.chat", JSON.stringify({ model, base }));
    } catch (e) {}
  }));

async function probeAPI() {
  try {
    const r = await fetch("api/health");
    API = r.ok;
  } catch (e) { API = false; }
  document.getElementById("keybar").hidden = !API;
  document.querySelectorAll("[data-vote],[data-chat],[data-fbsend]")
    .forEach(b => { b.disabled = !API; });
  if (!API) {
    document.querySelectorAll(".votenote").forEach(n => {
      n.textContent = "read only: start run.py serve for feedback and chat";
    });
  } else {
    loadFeedback();
  }
}

let FB = {};                            // opportunity id -> {up, down, note}

async function loadFeedback() {
  try {
    const r = await fetch("api/feedback");
    if (!r.ok) return;
    FB = (await r.json()).summary || {};
  } catch (e) { return; }
  paintFeedback();
}

// Painted from the cached summary, so re-rendering on a keystroke costs
// nothing. One request per page load, not one per visible row.
function paintFeedback() {
  document.querySelectorAll("[data-fb]").forEach(node => {
    const f = FB[node.dataset.fb];
    node.textContent = f
      ? `recorded: ${f.up} useful, ${f.down} not for us` + (f.note ? ` (latest: ${f.note})` : "")
      : "";
  });
}

// Thumbs reveal the comment box; the vote is only sent on Send, so one click
// cannot post an empty judgement by accident.
document.getElementById("list").addEventListener("click", e => {
  const vote = e.target.closest("[data-vote]");
  if (vote && API) {
    const id = vote.dataset.id;
    const box = document.querySelector(`[data-fbbox="${CSS.escape(id)}"]`);
    document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`)
      .forEach(b => b.setAttribute("aria-pressed", b === vote));
    box.classList.add("on");
    box.dataset.verdict = vote.dataset.vote;
    box.querySelector("input").focus();
    return;
  }

  const send = e.target.closest("[data-fbsend]");
  if (send && API) { sendFeedback(send.dataset.fbsend); return; }

  const chat = e.target.closest("[data-chat]");
  if (chat) {
    const box = document.querySelector(`[data-chatbox="${CSS.escape(chat.dataset.chat)}"]`);
    box.classList.toggle("on");
    if (box.classList.contains("on")) box.querySelector("input").focus();
  }
});

async function sendFeedback(id) {
  const box  = document.querySelector(`[data-fbbox="${CSS.escape(id)}"]`);
  const note = box.querySelector("input").value.trim();
  const verdict = box.dataset.verdict;
  const label = document.querySelector(`[data-fb="${CSS.escape(id)}"]`);
  if (!verdict) return;
  label.textContent = "sending...";
  try {
    // The nightly job can hold SQLite's writer briefly, so allow for a wait,
    // but never leave the button saying "sending..." forever.
    const r = await fetch("api/feedback", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ opportunity_id: id, verdict, note }),
      signal: AbortSignal.timeout(45000),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { label.textContent = d.detail || `failed (${r.status})`; return; }
    const f = FB[id] || { up: 0, down: 0, note: "" };
    if (verdict === "up") f.up++; else f.down++;
    f.note = note;
    FB[id] = f;
    label.textContent = `recorded "${verdict}". It joins the next prompt as a calibration example.`;
    box.classList.remove("on");
    box.querySelector("input").value = "";
  } catch (err) {
    label.textContent = err.name === "TimeoutError"
      ? "timed out; the nightly job may be writing. Try again shortly."
      : "could not reach the server";
  }
}

document.getElementById("list").addEventListener("submit", async e => {
  const form = e.target.closest("[data-chatform]");
  if (!form) return;
  e.preventDefault();
  const id = form.dataset.chatform;
  const input = form.querySelector("input");
  const q = input.value.trim();
  if (!q) return;

  const { key, model, base } = keyBar();
  const hint = document.querySelector(`[data-chathint="${CSS.escape(id)}"]`);
  if (!key) { hint.textContent = "Enter your API key in the bar at the top first."; return; }

  const log = document.querySelector(`[data-chatlog="${CSS.escape(id)}"]`);
  CHATS[id] = CHATS[id] || [];
  CHATS[id].push({ role: "user", content: q });
  log.insertAdjacentHTML("beforeend", `<div class="turn"><b>You</b><br>${esc(q)}</div>`);
  input.value = "";
  hint.textContent = "thinking...";
  log.scrollTop = log.scrollHeight;

  try {
    const r = await fetch("api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        opportunity_id: id, api_key: key, model, base_url: base,
        messages: CHATS[id],
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { hint.textContent = d.detail || `failed (${r.status})`; return; }
    CHATS[id].push({ role: "assistant", content: d.content });
    log.insertAdjacentHTML("beforeend", `<div class="turn"><b>Model</b><br>${esc(d.content)}</div>`);
    const u = d.usage || {};
    hint.textContent = u.prompt_tokens
      ? `${u.prompt_tokens} in / ${u.completion_tokens} out tokens, billed to your key`
      : "";
    log.scrollTop = log.scrollHeight;
  } catch (err) {
    hint.textContent = "could not reach the server";
  }
});

function boot(payload) {
  DATA = payload.opportunities || [];
  const soon = DATA.filter(o => { const a = daysAway(o.deadline); return a !== null && a >= 0 && a <= 30; });
  document.getElementById("n-open").textContent  = DATA.length;
  document.getElementById("n-soon").textContent  = soon.length;
  document.getElementById("n-match").textContent = DATA.filter(o => o.match_name).length;
  document.getElementById("asof").textContent =
    "updated " + (payload.generated_at || "").slice(0, 10);

  // Built from the data, not from a hardcoded list, so it always reflects the
  // roster as it actually matched. Count per area, commonest first.
  const counts = new Map();
  DATA.forEach(o => o.match_domain && counts.set(o.match_domain, (counts.get(o.match_domain) || 0) + 1));
  const sel = document.getElementById("area");
  [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .forEach(([d, n]) => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = `${d} (${n})`;
      sel.appendChild(opt);
    });
  if (!counts.size) sel.disabled = true;

  const stale = payload.stale_sources || [];
  if (stale.length) {
    document.getElementById("alarm").innerHTML =
      `<div class="alarm">${stale.length} source${stale.length > 1 ? "s have" : " has"}
       not updated in over 30 days: ${stale.map(s => esc(s.name)).join(", ")}.
       Check the adapter before trusting this list as complete.</div>`;
  }
  document.getElementById("foot").textContent =
    `Generated ${payload.generated_at || "unknown"}. Scores and collaborator matches are model-generated; treat them as a first pass, not a decision.`;
  render();
  probeAPI();
}

document.getElementById("q").addEventListener("input", e => {
  QUERY = e.target.value.trim().toLowerCase(); render();
});
document.getElementById("sort").addEventListener("change", e => {
  SORT = e.target.value; render();
});
document.getElementById("area").addEventListener("change", e => {
  AREA = e.target.value; render();
});
// Clicking an area tag on a row filters to it, and keeps the picker in sync.
document.getElementById("list").addEventListener("click", e => {
  const tag = e.target.closest(".areatag");
  if (!tag) return;
  AREA = AREA === tag.dataset.area ? "" : tag.dataset.area;
  document.getElementById("area").value = AREA;
  render();
});
document.querySelectorAll(".chip").forEach(btn => {
  btn.addEventListener("click", () => {
    const f = btn.dataset.filter;
    ACTIVE.has(f) ? ACTIVE.delete(f) : ACTIVE.add(f);
    btn.setAttribute("aria-pressed", ACTIVE.has(f));
    render();
  });
});

fetch("opportunities.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(boot)
  .catch(() => {
    document.getElementById("list").innerHTML =
      `<div class="empty"><b>No data file yet.</b>
       Run <code>python run.py daily</code> to generate opportunities.json.</div>`;
    document.getElementById("asof").textContent = "no data";
  });
</script>
</body>
</html>
