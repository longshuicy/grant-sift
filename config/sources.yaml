# Every source Grant Sift reads. Nothing is discovered by following links -
# if it is not in this file, it is not fetched.

# QUERY terms, not filter terms. Each one costs a separate Grants.gov POST and
# NSF GET, and each is capped at `rows` results (200 / 100). A term broad enough
# to exceed that cap is silently truncated, which is the "reports success while
# going incomplete" failure this tool exists to avoid. So keep these specific and
# discriminating, and put the loose vocabulary in prefilter.yaml instead, where a
# false positive costs a fraction of a cent rather than a missed call.
#
# This is the recall gate: nothing matching none of these is ever fetched, and no
# prefilter tuning can recover it. Grouped by the specialty each term serves.
keywords:
  # core research software / cyberinfrastructure
  - research software
  - cyberinfrastructure
  - scientific software
  - software sustainability
  - open source software
  - software engineering
  - research computing

  # data management and engineering (Research Data Engineering)
  - data management
  - research data infrastructure
  - data curation
  - data engineering
  - metadata standards
  - data interoperability

  # computation and workflow
  - computational infrastructure
  - high performance computing
  - scientific workflow
  - workflow
  - reproducibility

  # visualization and visual analytics (Visual Analytics)
  - scientific visualization
  - visual analytics
  - geospatial analysis
  - remote sensing
  - image analysis

  # platforms, gateways and research infrastructure (Tools for Research
  # Institutes and Infrastructure; Software Applications and Data Lab)
  - science gateway
  - research infrastructure
  - knowledge graph
  - digital twin

  # human-centred design (UI/UX)
  - human-centered design
  - user-centered design

  # learning technologies (Research Software Applications and Learning
  # Technologies)
  - learning technology
  - educational technology

grants_gov:
  enabled: true
  # Leave empty for all agencies. Narrow it once you see the volume.
  agencies: []

nsf:
  enabled: true

feeds:
  # CURIOSS moved to foundations: below -- it publishes no RSS feed, so the
  # /feed.xml guess 404d. Verified 2026-09-04.
  - name: ReSA
    url: https://www.researchsoft.org/blog/index.xml

# Fixed list. Add a source only when one of these misses something you
# would have wanted. Fifteen is plenty to start.
foundations:
  - name: Chan Zuckerberg Initiative
    url: https://chanzuckerberg.com/science/science-funding/
    cadence: weekly
    notes: >
      canonical RFA list, filterable. /rfa/ itself 404s even though
      /rfa/<name>/ pages exist. EOSS is co-funded with Wellcome and Kavli;
      Cycle 6 has closed. Verified 2026-09-04.

  - name: Alfred P. Sloan Foundation
    url: https://sloan.org/grants/apply
    cadence: weekly
    notes: >
      /programs is a JavaScript shell (489 chars of text, under the
      MIN_PAGE_TEXT guard). /grants redirects here. Verified 2026-09-04.

  - name: Gordon and Betty Moore Foundation
    url: https://www.moore.org/grants
    cadence: weekly

  - name: Schmidt Sciences
    url: https://www.schmidtsciences.org/opportunities
    cadence: weekly

  - name: Simons Foundation
    url: https://www.simonsfoundation.org/funding-opportunities/
    cadence: weekly

  - name: Mellon Foundation
    url: https://www.mellon.org/resources/for-grant-seekers
    cadence: weekly
    notes: >
      the humanities and digital scholarship lane. Most Mellon money is
      staff-invited; this page is where the rare open calls appear.
      /grant-programs is prose only, no deadlines. Verified 2026-09-04.

  - name: Alpha-Omega
    url: https://alpha-omega.dev/
    cadence: monthly
    notes: open source security; scientific stack is uncovered

  - name: Sovereign Tech Agency
    url: https://www.sovereign.tech/programs
    cadence: monthly

  - name: Wellcome Trust
    url: https://wellcome.org/research-funding/schemes
    cadence: weekly
    notes: >
      UNREACHABLE by plain HTTP: every path answers 202 with an empty body, a
      bot wall. No URL change fixes this; it needs a headless browser or their
      API. Left in deliberately so it fails loudly rather than disappearing.
      Wellcome co-funds EOSS, which still surfaces via the CZI page.
      Verified 2026-09-04.

  - name: Kavli Foundation
    url: https://www.kavlifoundation.org/funding-opportunities
    cadence: monthly
    notes: >
      /grants was the wrong page twice over: a 70-char JavaScript shell, and
      titled "Funded Work" (past grants, not open calls). Verified 2026-09-04.

  - name: NumFOCUS
    url: https://numfocus.org/programs
    cadence: monthly

  - name: Code for Science and Society
    url: https://www.codeforsociety.org/programs
    cadence: monthly
    notes: >
      the domain moved from codeforscience.org to codeforsociety.org. This page
      is thin (about 640 chars), so a redesign may trip MIN_PAGE_TEXT; that is
      the intended loud failure. Do NOT use digitalinfrastructure.fund: the
      domain lapsed and now redirects to a betting site. Verified 2026-09-04.

  - name: Arnold Ventures
    url: https://www.arnoldventures.org/grants
    cadence: monthly

  - name: David and Lucile Packard Foundation
    url: https://www.packard.org/what-we-fund/
    cadence: monthly

  - name: Illinois Research Board
    url: https://research.illinois.edu/find-funding/featured-funding-opportunities
    cadence: weekly
    notes: >
      internal campus money; never appears in any national database. The page
      has a "view all" tab. Verified 2026-09-04.

  - name: CURIOSS
    url: https://curioss.org/resources/funding-opportunities/
    cadence: weekly
    notes: >
      community of university open-source programme offices. Human-curated, so
      it stays in always_assess_sources. Was configured as an RSS feed, but the
      site publishes none -- fetched as a page instead. Verified 2026-09-04.
