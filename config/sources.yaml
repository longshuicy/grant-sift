# ---------------------------------------------------------------------------
# Sitemap-expanded sources.
#
# Some funders publish a listing their visitors can read but a fetcher cannot.
# Wellcome's schemes page strips to 1,947 chars of filter chrome around the text
# "Showing 13 results of 13", and not one of those 13 titles exists anywhere in
# its 141,861 chars of HTML. The individual scheme pages are plain server-
# rendered HTML; the sitemap is how you learn which ones exist.
#
# Listing those pages by hand does not work either, because they churn: 63 of
# Wellcome's 112 scheme pages are already closed, and RWJF stamps the year into
# every call URL. A hand-pinned set is majority-dead within a year, needs a
# human to prune each 404, and never sees a scheme published next week.
#
# So what is pinned and reviewed here is the RULE, not the URL list. It stays
# bounded three ways -- one domain, one include, one exclude -- and `max` is a
# hard refusal, not a truncation: gatesfoundation.org/sitemap_grants.xml lists
# 41,507 committed grants, and one loose `include` without a ceiling would be
# tens of thousands of fetches and model calls in a single night.
#
# Health is recorded per funder, so zero_streak means something: "Wellcome
# yielded nothing three runs running" is a real signal, where 45 separate rows
# would be noise. Check a rule still matches after a site redesign with:
#   python scripts/probe_sources.py --sitemap <url> --grep <include>
# ---------------------------------------------------------------------------
sitemaps:
  - name: Wellcome
    sitemap: https://wellcome.org/sitemap.xml
    include: '/research-funding/schemes/'
    exclude: '-closed$|check-your-eligibility'
    cadence: weekly
    max: 150
    notes: >
      112 scheme pages, 49 live. A closed scheme 404s because Wellcome moves it
      to a -closed slug, so a few per-page failures are the healthy steady
      state; all of them failing is not, and sitemap_pages raises on that.
      Verified 2026-09-23.

  - name: RWJF
    sitemap: https://www.rwjf.org/sitemap.xml
    include: 'active-funding-opportunities/20\d\d/'
    cadence: weekly
    max: 60
    notes: >
      the listing itself is 7k of chrome with the calls loaded client-side; the
      individual year-stamped call pages render at 11k-18k. Do NOT loosen this
      to /grants/: 174 URLs under it are grantee STORIES, which are past work.
      Verified 2026-09-23.

  - name: Cisco Research
    sitemap: https://research.cisco.com/sitemap.xml
    include: '/open-rfps/.+'
    cadence: weekly
    max: 60
    notes: >
      both the index (/open-rfps, 507 chars) and the NUMBERED call pages
      (/open-rfps/29, 34 chars) are JavaScript shells, so the numeric URLs a
      GrantForward export gives you are useless; only these slug URLs render.
      Partial coverage: the sitemap lists 4 of the 13 RFPs GrantForward knows
      about. Research gifts, not grants. Verified 2026-09-23.
