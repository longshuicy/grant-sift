# Every source Grant Sift reads. Nothing is discovered by following links -
# if it is not in this file, it is not fetched.

# QUERY terms, not filter terms. Each one costs a separate Grants.gov POST and
# is capped at `rows` results (200). A term broad enough
# to exceed that cap is silently truncated, which is the "reports success while
# going incomplete" failure this tool exists to avoid. So keep these specific and
# discriminating, and put the loose vocabulary in prefilter.yaml instead, where a
# false positive costs a fraction of a cent rather than a missed call.
#
# This is the recall gate: nothing matching none of these is ever fetched, and no
# prefilter tuning can recover it. Grouped by the specialty each term serves.
keywords:
  # core research software / cyberinfrastructure
  - research software
  - cyberinfrastructure
  - scientific software
  - software sustainability
  - open source software
  - software engineering
  - research computing

  # data management and engineering (Research Data Engineering)
  - data management
  - research data infrastructure
  - data curation
  - data engineering
  - metadata standards
  - data interoperability

  # computation and workflow
  - computational infrastructure
  - high performance computing
  - scientific workflow
  - workflow
  - reproducibility

  # visualization and visual analytics (Visual Analytics)
  - scientific visualization
  - visual analytics
  - geospatial analysis
  - remote sensing
  - image analysis

  # platforms, gateways and research infrastructure (Tools for Research
  # Institutes and Infrastructure; Software Applications and Data Lab)
  - science gateway
  - research infrastructure
  - knowledge graph
  - digital twin

  # human-centred design (UI/UX)
  - human-centered design
  - user-centered design

  # learning technologies (Research Software Applications and Learning
  # Technologies)
  - learning technology
  - educational technology

grants_gov:
  enabled: true
  # Leave empty for all agencies. Narrow it once you see the volume.
  agencies: []

# DISABLED 2026-09-08. NSF retired the publicationsapi/fundingSearch endpoint;
# it now answers 200 with a 128-byte meta-refresh to /awardsearch/simple-search,
# so the adapter parsed nothing, returned an empty list, and was recorded as a
# SUCCESS with zero yield - four runs in a row. The zero_streak check caught it
# and flagged the source stale, which is the machinery working; the adapter is
# what is broken.
#
# Not replaced, because nothing is lost: Grants.gov already carries NSF, and
# 132 NSF-funded records reach us that way. A permanently red source trains
# people to ignore the stale banner, which is the one thing that banner cannot
# afford. Re-enable only with an adapter written against whatever NSF exposes
# now, and confirm a non-zero yield before trusting it.
nsf:
  enabled: false

feeds:
  # CURIOSS moved to foundations: below -- it publishes no RSS feed, so the
  # /feed.xml guess 404d. Verified 2026-09-04.
  - name: ReSA
    url: https://www.researchsoft.org/blog/index.xml

