# Anything from these funders goes to the classifier regardless of keywords -
# their calls are few and often worth reading in full.
# Matched against rec["agency"]. Foundation adapters set agency to the source
# name, so every foundation in sources.yaml must appear here, otherwise a call
# we already paid the model to extract can still be dropped for want of a
# keyword, which is the one loss this pipeline should never take.
agency_allowlist:
  - National Science Foundation
  - Department of Energy
  - Chan Zuckerberg
  - Sloan
  - Moore Foundation
  - Schmidt
  - Simons Foundation
  - Mellon
  - Wellcome
  - Kavli
  - Alpha-Omega
  - Sovereign Tech
  - NumFOCUS
  - Code for Science and Society
  - Arnold Ventures
  - Packard
  - Illinois Research Board

# Sources curated by humans elsewhere, assess everything they surface.
# Matched with str.startswith against rec["source"]. MUST be quoted: a bare
# `- fnd:` is YAML for the dict {fnd: None}, which made startswith() raise
# TypeError and take the whole source down with it.
#
# NOTE "fnd:" is currently a no-op: it is the prefix of rec["id"], not of
# rec["source"], which adapters set to the foundation's name. Foundations are
# covered by agency_allowlist above instead. Left here, quoted and harmless,
# only so the intent is visible.
always_assess_sources:
  - "fnd:"
  - CURIOSS
  - ReSA

# Regex, matched against lowercased title + synopsis.
exclude_patterns:
  - "\\bconstruction of (a )?(building|facility)\\b"
  - "\\bscholarship for undergraduate students\\b"
  - "\\bdissertation improvement\\b"
  - "\\btravel award\\b"
  - "\\bclinical trial recruitment\\b"
  - "\\bsmall business innovation research\\b"   # SBIR: not eligible as a university
  - "\\bsmall business technology transfer\\b"
