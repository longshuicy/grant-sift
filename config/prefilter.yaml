# Annotation only. NOTHING HERE DISCARDS A RECORD.
#
# Everything fetched is stored and reaches the classifier. Relevance and
# ranking are decided by the model against config/roster.yaml, because that is
# the only judgement here with any context; a deterministic regex has none.
#
# What these rules still do is leave a note on each record (the `screen`
# column) saying what stood out: which keywords matched, whether the funder is
# on the allowlist, and whether it looks like something a keyword screen would
# once have thrown away. Useful for auditing what a filter WOULD have cost you.
#
# Closed calls are annotated too, not dropped, and pruning is off unless
# GRANT_SIFT_PRUNE_DAYS is set. A record of what was once open is worth keeping.

# 0 means every fetched record reaches the classifier. Measured 2026-09-04:
# raising this to 1 dropped 1,041 records to 597, and the 444 difference cost
# only about 0.4 coins to assess. Recall is worth more than that, so the
# keyword list below now only annotates why a record matched; it no longer
# gates. exclude_patterns still apply, and they are the only real filter left.
min_keyword_hits: 0

# Substring matched, case-insensitively, against lowercased title + synopsis.
# Loose on purpose: a false exclusion here is invisible and permanent, a false
# inclusion costs a fraction of a cent. Expect to tighten this, not loosen it.
#
# Two-letter tokens are deliberately absent, "ui" matches "building" and
# "circuit", "ux" matches "flux". Note that "api" below already behaves this way
# (it matches "rapid", "capital", "therapies"); it is kept because the cost of
# over-matching is a cent, but do not add more of that shape. "etl" and "gis"
# were dropped for exactly this reason -- they matched "wetland" and "registry"
# while adding no recall that the longer terms do not already give.
#
# Grouped to mirror the software leads' specialties, so it is obvious where a
# new term belongs.
