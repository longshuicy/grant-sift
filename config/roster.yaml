# Past and current collaborations. This file decides whether Grant Sift is
# useful, so keep it easy to edit — any RSE should be able to add a line
# with a pull request.
#
# status: warm | cold | do-not-contact
#   warm          we would call them tomorrow
#   cold          real past work, but the relationship has gone quiet
#   do-not-contact  do not surface, for whatever reason
#
# `collaborator` is the DOMAIN partner — the person who needs an RSE and may
# not know it. Our own staff belong in `notes` as the internal contact, not
# here, or the matcher will match us to ourselves.
#
# Only these fields reach the model: domain, collaborator, project, years,
# our_role, funders, status, notes. Any other key is silently ignored.
#
# PROVENANCE: assembled from ncsa.illinois.edu/isda project pages, Jong Lee's
# CV, Wenqi He's portfolio, and longshuicy.github.io. Names, funders, years and
# grant numbers are taken from those sources. `status` is NOT — it was inferred
# from dates alone (ongoing => warm, ended => cold). Fix it; only you know.

