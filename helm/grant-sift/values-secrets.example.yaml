# Copy to values-secrets.yaml (gitignored) and fill in. Pass with:
#   helm upgrade --install grant-sift ./helm/grant-sift -f values-secrets.yaml ...

secrets:
  GRANT_SIFT_LLM_API_KEY: "sk_replace_me"

# oauth2-proxy expects a Secret with these keys (create it yourself):
#   kubectl create secret generic grant-sift-oauth2 \
#     --from-literal=client-id=... \
#     --from-literal=client-secret=... \
#     --from-literal=cookie-secret=$(openssl rand -base64 32 | head -c 32 | base64)
#
# Then:
# oauth2-proxy:
#   config:
#     existingSecret: grant-sift-oauth2
#   extraArgs:
#     - --oidc-issuer-url=https://keycloak.example.com/realms/your-realm

# Grafana (when grafana.enabled). Create separately — do not put secrets here:
#   kubectl -n grant-sift create secret generic grant-sift-grafana \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password="$(openssl rand -base64 24)" \
#     --from-literal=client-secret='KEYCLOAK_CLIENT_SECRET_FOR_grant-sift-grafana'
# Keycloak client setup (same realm as the app): see GRAFANA.md
# grafana:
#   admin:
#     existingSecret: grant-sift-grafana
#   keycloakAuth:
#     enabled: true
