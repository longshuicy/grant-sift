{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "grant-sift.secretName" . }}
  labels:
    {{- include "grant-sift.labels" . | nindent 4 }}
type: Opaque
stringData:
  GRANT_SIFT_LLM_API_KEY: {{ required "secrets.GRANT_SIFT_LLM_API_KEY is required (or set secrets.existingSecret)" .Values.secrets.GRANT_SIFT_LLM_API_KEY | quote }}
{{- end }}
